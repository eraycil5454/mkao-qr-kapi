
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MKAO QR KAPI</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#f3f6f9;color:#10233f;font-family:Arial,sans-serif}
header{background:#12385b;color:#fff;padding:18px;text-align:center}
main{max-width:650px;margin:auto;padding:15px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px #0001}
.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:700;background:#e8edf2}
.mode button.active{background:#12385b;color:white}
#reader{width:100%;overflow:hidden;border-radius:12px}.result{margin-top:14px;padding:18px;text-align:center;border-radius:12px;background:#eef2f5;min-height:60px}
.ok{background:#e6f7eb;color:#12632b}.bad{background:#fdecec;color:#8a2020}
</style>
</head>
<body>
<header><b>MKAO QR KAPI</b><br><small>Öğle Arası Giriş / Çıkış</small></header>
<main><div class="card">
<div class="mode"><button id="c" class="active" onclick="mode='CIKIS';c.classList.add('active');g.classList.remove('active')">🚪 ÇIKIŞ</button><button id="g" onclick="mode='GIRIS';g.classList.add('active');c.classList.remove('active')">↩️ GİRİŞ</button></div>
<div id="reader"></div><div id="result" class="result">Kamera hazırlanıyor...</div>
</div></main>
<script>
const BACKEND="https://script.google.com/macros/s/AKfycbzQOec3vX6DU68XsnnyvoosDMX-lxCFERWsfgNqkhXwuoZ-y3fCWyHRopH_qZzqYKks/exec";
let mode="CIKIS",busy=false,last="",lastTime=0;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function msg(s,ok){result.className="result "+(ok?"ok":"bad");result.innerHTML=s;}
function send(kod){
 const now=Date.now();if(busy||(kod===last&&now-lastTime<2500))return;
 busy=true;last=kod;lastTime=now;msg("Okundu: <b>"+esc(kod)+"</b><br>İşlem gönderiliyor...",false);
 const cb="mkao_cb_"+now;
 window[cb]=function(r){
   try{
    if(r&&r.ok)msg("✅ <b>"+esc(r.adSoyad)+"</b><br>"+esc(r.sinif)+" · "+esc(r.saat)+"<br>"+esc(r.mesaj),true);
    else msg("⛔ <b>"+esc((r&&r.adSoyad)||kod)+"</b><br>"+esc((r&&r.mesaj)||"İşlem reddedildi."),false);
   }finally{busy=false;setTimeout(()=>{try{delete window[cb]}catch(e){}},1000);}
 };
 const s=document.createElement("script");
 s.src=BACKEND+"?api=qr&kod="+encodeURIComponent(kod)+"&islem="+encodeURIComponent(mode)+"&kaynak=GITHUB&callback="+cb;
 s.onerror=()=>{busy=false;msg("⚠️ Apps Script bağlantısı kurulamadı.",false);};
 document.body.appendChild(s);
}
const qr=new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},t=>send(String(t).trim().toUpperCase()),()=>{})
.catch(()=>msg("Kamera açılamadı. Kamera iznini kontrol edin.",false));
</script>
</body>
</html>

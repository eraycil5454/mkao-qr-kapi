<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MKAO QR Kapı</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    .ust {
      background: #ffffff;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .ust h1 {
      margin: 0;
      font-size: 22px;
    }

    .ust p {
      margin: 6px 0 0;
      color: #666;
      font-size: 14px;
    }

    .alan {
      max-width: 520px;
      margin: 20px auto;
      padding: 15px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    .durum {
      margin-top: 15px;
      background: white;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bilgi {
      margin-top: 10px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <div class="ust">

    <h1>
      MKAO QR KAPI
    </h1>

    <p>
      Öğrenci Çıkış / Giriş Sistemi
    </p>

  </div>


  <div class="alan">

    <div id="reader"></div>

    <div
      id="durum"
      class="durum"
    >
      Kamera başlatılıyor...
    </div>

    <div class="bilgi">
      QR kodu kameraya gösterin.
    </div>

  </div>


<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzQOec3vX6DU68XsnnyvoosDMX-lxCFERWsfgNqkhXwuoZ-y3fCWyHRopH_qZzqYKks/exec";


let taramaKilitli = false;


/*
 * Ekrandaki durumu değiştirir.
 */
function durumYaz(metin) {

  document.getElementById("durum")
    .textContent = metin;
}


/*
 * QR okunduğunda çalışır.
 */
function qrOkundu(qrMetni) {

  if (taramaKilitli) {
    return;
  }

  let kod = String(qrMetni || "")
    .trim();

  /*
   * QR doğrudan MKAO-100 olabilir.
   */
  if (
    kod.toUpperCase().startsWith("MKAO-")
  ) {

    kod = kod.toUpperCase();

  } else {

    /*
     * QR URL içeriyorsa kod parametresini al.
     */
    try {

      const url = new URL(kod);

      const urlKod =
        url.searchParams.get("kod");

      if (urlKod) {
        kod = urlKod
          .trim()
          .toUpperCase();
      }

    } catch (e) {
      // URL değilse olduğu gibi bırak
    }
  }


  if (!kod) {

    durumYaz(
      "❌ Geçersiz QR kodu"
    );

    return;
  }


  /*
   * Aynı QR'ın kamera tarafından
   * art arda okunmasını engelle.
   */
  taramaKilitli = true;

  durumYaz(
    "⏳ QR okundu – işlem yapılıyor..."
  );


  /*
   * JSONP callback
   */
  window.mkaoSonuc = function(sonuc) {

    console.log(
      "Apps Script sonucu:",
      sonuc
    );


    if (!sonuc) {

      durumYaz(
        "❌ Sunucudan sonuç alınamadı."
      );

      taramaKilitli = false;
      return;
    }


    /*
     * RED
     */
    if (sonuc.ok === false) {

      if (sonuc.sonuc === "MÜKERRER") {

        durumYaz(
          "⚠️ MÜKERRER ÇIKIŞ\n" +
          (sonuc.adSoyad || "")
        );

      } else {

        durumYaz(
          "❌ " +
          (sonuc.mesaj || "İşlem reddedildi.")
        );
      }


      setTimeout(
        function() {

          durumYaz(
            "QR kodu kameraya gösterin."
          );

          taramaKilitli = false;

        },
        3000
      );

      return;
    }


    /*
     * ONAY
     */
    if (
      sonuc.ok === true &&
      sonuc.sonuc === "ONAY"
    ) {

      durumYaz(
        "✅ " +
        (sonuc.islem || "İŞLEM") +
        "\n" +
        (sonuc.adSoyad || "") +
        " - " +
        (sonuc.sinif || "")
      );


      setTimeout(
        function() {

          durumYaz(
            "QR kodu kameraya gösterin."
          );

          taramaKilitli = false;

        },
        3000
      );

      return;
    }


    durumYaz(
      "❌ Beklenmeyen sonuç."
    );

    taramaKilitli = false;
  };


  /*
   * JSONP için script etiketi oluştur.
   */
  const script =
    document.createElement("script");


  script.src =
    BACKEND_URL +
    "?api=jsonp" +
    "&kod=" +
    encodeURIComponent(kod) +
    "&kaynak=KAPI" +
    "&callback=mkaoSonuc" +
    "&t=" +
    Date.now();


  script.onerror = function() {

    durumYaz(
      "❌ Sunucuya ulaşılamadı."
    );

    taramaKilitli = false;
  };


  document.body.appendChild(script);


  /*
   * Script etiketini biraz sonra temizle.
   */
  setTimeout(
    function() {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    },
    10000
  );
}


/*
 * Kamera başlat.
 */
function kamerayiBaslat() {

  const scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    qrOkundu,

    function(hata) {
      // Normal kamera tarama hatalarını
      // ekrana yazmıyoruz.
    }

  ).then(function() {

    durumYaz(
      "📷 Kamera hazır – QR kodu okutun."
    );

  }).catch(function(hata) {

    console.error(hata);

    durumYaz(
      "❌ Kamera başlatılamadı. " +
      "Kamera iznini kontrol edin."
    );

  });
}


/*
 * Sayfa açıldığında kamerayı başlat.
 */
window.addEventListener(
  "load",
  kamerayiBaslat
);

</script>

</body>
</html>
